# M3.8 — schema migration Job.
#
# The Deployment never migrates on start. Run this Job before a rollout that
# ships new migrations:
#
#   kubectl -n agenthub delete job agenthub-migrate --ignore-not-found
#   kubectl apply -f deploy/k8s/migrate-job.yaml
#   kubectl -n agenthub wait --for=condition=complete job/agenthub-migrate --timeout=120s
#
# The Job reads /etc/agenthub/config.yaml from the same ConfigMap as the
# Deployment. `dsn: ${DATABASE_DSN}` is expanded from the unprefixed Secret
# keys injected by `envFrom` below.
apiVersion: batch/v1
kind: Job
metadata:
  name: agenthub-migrate
  namespace: agenthub
  labels:
    app.kubernetes.io/name: agenthub-migrate
    app.kubernetes.io/part-of: agenthub
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 6
  # Keep the completed Job long enough to inspect its logs, then let the
  # TTL controller remove it so the next apply is not blocked by the name.
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agenthub-migrate
        app.kubernetes.io/part-of: agenthub
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/pilab-dev/agenthub-server:20261105-r2
          imagePullPolicy: IfNotPresent
          args: ["migrate", "--config", "/etc/agenthub/config.yaml"]
          envFrom:
            - secretRef:
                name: agenthub-secrets
          volumeMounts:
            - name: config
              mountPath: /etc/agenthub
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: agenthub-config
