version: v2
clean: true
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: go.pilab.hu/agenthub/gen/go
plugins:
  - local: [go, run, google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12]
    out: gen/go
    opt: paths=source_relative
  - local: [go, run, connectrpc.com/connect/cmd/protoc-gen-connect-go@v1.19.1]
    out: gen/go
    opt: paths=source_relative
  - remote: buf.build/bufbuild/es
    out: gen/ts
    opt: target=ts
